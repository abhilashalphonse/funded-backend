name: Funded Backend CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Checkout ACG Trader backend for cross-repo launch harness
        uses: actions/checkout@v4
        with:
          repository: abhilashalphonse/acg-trader-backend
          path: acg-trader-backend

      - name: Install ACG Trader backend dependencies
        run: npm ci --prefix acg-trader-backend

      - name: Run cross-repo launch lifecycle harness
        env:
          ACG_TRADER_REPO_PATH: acg-trader-backend
        run: node --test tests/launch-e2e-harness.test.js
